#cloud-config

write_files:
  - path: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    permissions: "0644"
    content: |
      network: {config: disabled}

  - path: /etc/netplan/99-custom.yaml
    permissions: "0644"
    content: |
      network:
        version: 2
        ethernets:
          ens160:
            dhcp4: no
            addresses:
              - $ip/24
            routes:
              - to: default
                via: 192.168.115.254
            nameservers:
              addresses:
                - 192.168.200.10
                - 8.8.4.4
runcmd:
  - rm -f /etc/netplan/50-cloud-init.yaml
  - netplan apply

