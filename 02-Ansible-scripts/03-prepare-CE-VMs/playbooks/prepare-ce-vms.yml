---
- name: Prepare CE VMs and bare-metal nodes
  hosts: ce_nodes
  gather_facts: true
  become: true

  tasks:
    - name: Apply requested hostname
      ansible.builtin.hostname:
        name: "{{ ce_hostname }}"
      when: ce_hostname | length > 0

    - name: Ensure required runtime commands are present
      ansible.builtin.shell: "command -v {{ item }}"
      args:
        executable: /bin/bash
      changed_when: false
      loop:
        - ip
        - netplan

    - name: Detect route used for internet probe
      ansible.builtin.command: "ip -j -4 route get {{ internet_probe_ip }}"
      register: internet_route
      changed_when: false
      when: >
        internet_interface_name | length == 0
        or internet_interface_cidr | length == 0

    - name: Parse detected internet route
      ansible.builtin.set_fact:
        ce_internet_route: "{{ (internet_route.stdout | from_json)[0] }}"
      when: >
        internet_interface_name | length == 0
        or internet_interface_cidr | length == 0

    - name: Derive internet interface name
      ansible.builtin.set_fact:
        ce_internet_interface: >-
          {{
            internet_interface_name
            if internet_interface_name | length > 0
            else ce_internet_route.dev
          }}

    - name: Read IPv4 details from internet interface
      ansible.builtin.command: >-
        ip -j -4 addr show dev {{ ce_internet_interface }}
      register: internet_interface_addr
      changed_when: false
      when: internet_interface_cidr | length == 0

    - name: Parse internet interface IPv4 details
      ansible.builtin.set_fact:
        ce_internet_addr_info: >-
          {{
            (
              (internet_interface_addr.stdout | from_json)[0].addr_info
              | selectattr('family', 'equalto', 'inet')
              | list
            )[0]
          }}
      when: internet_interface_cidr | length == 0

    - name: Set internet interface CIDR
      ansible.builtin.set_fact:
        ce_internet_cidr: >-
          {{
            internet_interface_cidr
            if internet_interface_cidr | length > 0
            else ce_internet_addr_info.local
            ~ '/'
            ~ ce_internet_addr_info.prefixlen
          }}

    - name: Set internet gateway
      ansible.builtin.set_fact:
        ce_internet_gateway: >-
          {{
            internet_gateway
            if internet_gateway | length > 0
            else ansible_facts["default_ipv4"]["gateway"]
          }}

    - name: Validate detected network values
      ansible.builtin.assert:
        that:
          - ce_internet_interface | length > 0
          - ce_internet_cidr | length > 0
          - ce_internet_gateway | length > 0
          - secondary_interface_name | length > 0
          - ce_internet_interface != secondary_interface_name
        fail_msg: >-
          Unable to derive a safe netplan configuration. Set
          internet_interface_name, internet_interface_cidr, internet_gateway,
          and secondary_interface_name explicitly in group_vars/all.yml.

    - name: Ensure NFS mount directories exist
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: directory
        owner: root
        group: root
        mode: "0755"
      loop: "{{ ce_fstab_entries }}"

    - name: Add required NFS entries to fstab
      ansible.builtin.lineinfile:
        path: /etc/fstab
        regexp: >-
          ^{{ item.src | regex_escape }}\s+{{ item.path | regex_escape }}\s+
        line: "{{ item.line }}"
        owner: root
        group: root
        mode: "0644"
        create: false
        backup: true
      loop: "{{ ce_fstab_entries }}"

    - name: Render netplan configuration
      ansible.builtin.template:
        src: ../templates/50-cloud-init.yaml.j2
        dest: "{{ netplan_config_path }}"
        owner: root
        group: root
        mode: "0600"
        backup: true
      notify: Apply netplan

  handlers:
    - name: Apply netplan
      ansible.builtin.command: netplan apply
      changed_when: true
