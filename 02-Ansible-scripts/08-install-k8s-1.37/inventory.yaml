all:
  vars:
    ansible_ssh_private_key_file: /var/lib/jenkins/.ssh/id_ed25519
    ansible_user: "ubuntu"
  children:
    k8s_master:
      hosts:
        master0:
          ansible_python_interpreter: "/usr/bin/python3"
          ansible_host: "172.17.0.16"
    k8s_workers:
      hosts:
        worker1:
          ansible_python_interpreter: "/usr/bin/python3"
          ansible_host: "172.17.0.13"
        worker2:
          ansible_python_interpreter: "/usr/bin/python3"
          ansible_host: "172.17.0.14"