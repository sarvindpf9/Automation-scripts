---
# Convert DHCP-assigned netplan interfaces to static entries.
#
# Required: run against the VM guest, not the Proxmox node.
#
# Variables (all optional):
#   target_interface    - single DHCP NIC to convert; defaults to all dhcp4: true ethernets
#   target_interfaces   - list of DHCP NICs to convert; defaults to all dhcp4: true ethernets
#   netplan_config_file - netplan file to update; defaults to /etc/netplan/50-cloud-init.yaml
#
# Usage:
#   # Single VM by IP (inline inventory):
#   ansible-playbook playbooks/dhcp-to-static.yml \
#     -i 192.168.100.21, \
#     -u ubuntu --private-key ~/.ssh/id_rsa \
#     -e ansible_become_pass=<sudo_password>
#
#   # Specific interface:
#   ansible-playbook playbooks/dhcp-to-static.yml \
#     -i 192.168.100.21, \
#     -u ubuntu --private-key ~/.ssh/id_rsa \
#     -e target_interface=ens18
#
#   # Multiple specific interfaces:
#   ansible-playbook playbooks/dhcp-to-static.yml \
#     -i 192.168.100.21, \
#     -u ubuntu --private-key ~/.ssh/id_rsa \
#     -e '{"target_interfaces": ["ens18", "ens19"]}'
#
#   # Override netplan file destination:
#   ansible-playbook playbooks/dhcp-to-static.yml \
#     -i 192.168.100.21, \
#     -u ubuntu --private-key ~/.ssh/id_rsa \
#     -e netplan_config_file=/etc/netplan/99-static.yaml

- name: Convert DHCP interface to static via netplan
  hosts: "{{ target_hosts | default('all') }}"
  gather_facts: true
  become: false
  tasks:
    - ansible.builtin.import_tasks: ../tasks/dhcp-to-static.yml
