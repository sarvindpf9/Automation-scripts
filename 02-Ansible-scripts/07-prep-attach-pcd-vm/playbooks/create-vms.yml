---
- name: Create Proxmox VMs from template
  hosts: proxmox_nodes
  gather_facts: false
  become: true

  tasks:
    - name: Run preflight checks
      ansible.builtin.import_tasks: ../tasks/preflight.yml

    - name: Allocate VM IDs
      ansible.builtin.import_tasks: ../tasks/allocate-vm-ids.yml

    - name: Render cloud-init snippets
      ansible.builtin.import_tasks: ../tasks/render-snippets.yml

    - name: Clone and configure VMs
      ansible.builtin.import_tasks: ../tasks/clone-vms.yml

    - name: Generate guest inventory
      ansible.builtin.import_tasks: ../tasks/generate-guest-inventory.yml
      when: generated_guest_inventory_enabled | bool
