---
- name: Ensure Proxmox snippets directory exists
  ansible.builtin.file:
    path: "{{ snippet_directory }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Render cloud-init user-data snippets
  ansible.builtin.template:
    src: ../templates/user-data.yaml.j2
    dest: "{{ snippet_directory }}/{{ effective_vm_name | regex_replace('[^a-zA-Z0-9-]', '-') }}-user-data.yaml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ vms | dict2items }}"
  loop_control:
    label: "{{ effective_vm_name }}"
  vars:
    vm_config: "{{ item.value }}"
    effective_vm_name: "{{ ([vm_name_prefix | default('', true) | trim, item.value.vm_name] | reject('equalto', '') | join('-')) }}"

- name: Render cloud-init network-data snippets
  ansible.builtin.template:
    src: ../templates/network-data.yaml.j2
    dest: "{{ snippet_directory }}/{{ effective_vm_name | regex_replace('[^a-zA-Z0-9-]', '-') }}-network-data.yaml"
    owner: root
    group: root
    mode: "0644"
  loop: "{{ vms | dict2items }}"
  loop_control:
    label: "{{ effective_vm_name }}"
  vars:
    vm_config: "{{ item.value }}"
    effective_vm_name: "{{ ([vm_name_prefix | default('', true) | trim, item.value.vm_name] | reject('equalto', '') | join('-')) }}"
