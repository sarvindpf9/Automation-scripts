---
- name: Validate required Proxmox variables
  ansible.builtin.assert:
    that:
      - proxmox_api_host | length > 0
      - proxmox_api_user | length > 0
      - proxmox_api_password | length > 0
      - proxmox_node | length > 0
      - datastore_id | length > 0
      - cloudinit_drive_datastore_id | length > 0
      - snippet_datastore_id | length > 0
      - snippet_directory | length > 0
      - vms is mapping
      - vms | length > 0
    fail_msg: "Fill in group_vars/all.yml placeholders before running the playbook."
  no_log: true

- name: Validate VM definitions
  ansible.builtin.assert:
    that:
      - item.value.vm_name | length > 0
      - (item.value.template_vm_id | default(template_vm_id)) is number
      - (item.value.template_vm_name | default(template_vm_name)) | length > 0
      - (item.value.cloud_init_user | default(cloud_init_user)) | length > 0
      # vm_id is optional — validated here only when explicitly set.
      # Auto-allocation and cluster-wide uniqueness are enforced in allocate-vm-ids.yml.
      - item.value.vm_id is not defined or (item.value.vm_id is number and item.value.vm_id | int >= 100 and item.value.vm_id | int <= 999999)
      - item.value.memory_mb is number
      - item.value.memory_mb >= 512
      - item.value.cores is number
      - item.value.cores >= 1
      - item.value.sockets is number
      - item.value.sockets >= 1
      - item.value.network_interfaces is sequence
      - item.value.network_interfaces | length > 0
    fail_msg: "Each VM must define vm_name, template source via per-VM or global template variables, memory_mb, cores, sockets, and network_interfaces. vm_id is optional (auto-allocated if omitted, must be 100–999999 if set)."
  loop: "{{ vms | dict2items }}"
  loop_control:
    label: "{{ item.key }}"

- name: Validate NIC definitions
  ansible.builtin.assert:
    that:
      - item.1.bridge is defined
      - item.1.bridge | default('', true) | length > 0
      - item.1.macaddr is not defined
      - item.1.vlani_id is not defined
    fail_msg: "Each NIC must define bridge, must not define macaddr, and must use vlan_id (not vlani_id) for a Proxmox VLAN tag. MAC addresses are discovered from Proxmox after VM NIC creation."
  loop: "{{ (vms | dict2items) | subelements('value.network_interfaces') }}"
  loop_control:
    label: "{{ item.0.key }}"

- name: Build list of declared VM IP addresses
  ansible.builtin.set_fact:
    declared_vm_ips: "{{ lookup('ansible.builtin.template', playbook_dir + '/../templates/vm-ip-list.yml.j2') | from_yaml | default([], true) }}"

- name: Build list of effective VM names
  ansible.builtin.set_fact:
    declared_vm_names: "{{ (declared_vm_names | default([])) + [effective_vm_name] }}"
  loop: "{{ vms | dict2items }}"
  loop_control:
    label: "{{ item.key }}"
  vars:
    effective_vm_name: "{{ ([vm_name_prefix | default('', true) | trim, item.value.vm_name] | reject('equalto', '') | join('-')) }}"

- name: Validate VM name and IP uniqueness
  ansible.builtin.assert:
    that:
      # Explicit vm_id uniqueness (within this run) is checked in allocate-vm-ids.yml.
      - (declared_vm_names | unique | length) == (declared_vm_names | length)
      - (declared_vm_ips | unique | length) == (declared_vm_ips | length)
    fail_msg: "VM names and all declared interface/VLAN IPs must be unique across the vms map."

- name: Read SSH public key from controller
  ansible.builtin.set_fact:
    vm_ssh_public_key: "{{ lookup('ansible.builtin.file', ssh_public_key_path) }}"
  delegate_to: localhost
  become: false
  run_once: true
