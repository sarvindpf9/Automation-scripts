---
- name: Resolve netplan configuration path
  ansible.builtin.set_fact:
    _netplan_config_file: "{{ netplan_config_file | default('/etc/netplan/50-cloud-init.yaml') }}"

- name: Read current netplan configuration
  ansible.builtin.slurp:
    src: "{{ _netplan_config_file }}"
  become: true
  register: _netplan_current

- name: Parse current netplan configuration
  ansible.builtin.set_fact:
    _netplan_doc: "{{ _netplan_current.content | b64decode | from_yaml }}"

- name: Validate current netplan configuration
  ansible.builtin.assert:
    that:
      - _netplan_doc is mapping
      - _netplan_doc.network is mapping
      - _netplan_doc.network.ethernets is mapping
    fail_msg: "{{ _netplan_config_file }} must contain network.ethernets before DHCP interfaces can be converted."

- name: Resolve explicitly requested target interfaces
  ansible.builtin.set_fact:
    _requested_target_interfaces: >-
      {{
        target_interfaces
        if target_interfaces is defined and target_interfaces is not string
        else [target_interfaces]
        if target_interfaces is defined
        else [target_interface]
        if target_interface is defined
        else []
      }}

- name: Resolve DHCP interfaces to convert
  ansible.builtin.set_fact:
    _dhcp_target_ifaces: >-
      {{
        _requested_target_interfaces
        if _requested_target_interfaces | length > 0
        else _netplan_doc.network.ethernets
          | dict2items
          | selectattr('value.dhcp4', 'defined')
          | selectattr('value.dhcp4', 'equalto', true)
          | map(attribute='key')
          | list
      }}

- name: Assert DHCP target interfaces are valid
  ansible.builtin.assert:
    that:
      - _dhcp_target_ifaces | length > 0
      - item in _netplan_doc.network.ethernets
      - _netplan_doc.network.ethernets[item].dhcp4 | default(false) | bool
      - ansible_facts[item] is defined
      - ansible_facts[item].ipv4 is defined
    fail_msg: "Interface {{ item }} must exist in {{ _netplan_config_file }}, have dhcp4: true, and have a gathered IPv4 address."
  loop: "{{ _dhcp_target_ifaces }}"

- name: Resolve nameservers for static netplan entries
  ansible.builtin.set_fact:
    _static_nameservers: "{{ nameservers | default(ansible_facts.get('dns', {}).get('nameservers', []), true) | default(['8.8.8.8'], true) }}"

- name: Build static netplan entries for DHCP interfaces
  ansible.builtin.set_fact:
    _static_interface_configs: "{{ _static_interface_configs | default({}) | combine({item: _static_iface_config}, recursive=True) }}"
  vars:
    _static_address: "{{ ansible_facts[item]['ipv4']['address'] }}/{{ ansible_facts[item]['ipv4']['prefix'] }}"
    _default_route: >-
      {{
        {
          'routes': [
            {
              'to': 'default',
              'via': ansible_facts['default_ipv4']['gateway']
            }
          ]
        }
        if item == ansible_facts.get('default_ipv4', {}).get('interface', '')
          and ansible_facts.get('default_ipv4', {}).get('gateway', '') | length > 0
        else {}
      }}
    _static_iface_config: >-
      {{
        _netplan_doc.network.ethernets[item]
        | combine(
            {
              'dhcp4': false,
              'addresses': [_static_address],
              'nameservers': {
                'addresses': _static_nameservers
              }
            },
            recursive=True
          )
        | combine(_default_route, recursive=True)
      }}
  loop: "{{ _dhcp_target_ifaces }}"

- name: Merge static entries into current netplan configuration
  ansible.builtin.set_fact:
    _updated_netplan_doc: >-
      {{
        _netplan_doc
        | combine(
            {
              'network': _netplan_doc.network
                | combine(
                    {
                      'ethernets': _netplan_doc.network.ethernets
                        | combine(_static_interface_configs, recursive=True)
                    },
                    recursive=True
                  )
            },
            recursive=True
          )
      }}

- name: Disable cloud-init network management
  ansible.builtin.copy:
    dest: /etc/cloud/cloud.cfg.d/99-disable-network-config.cfg
    content: "network: {config: disabled}\n"
    owner: root
    group: root
    mode: '0644'
  become: true

- name: Write merged static netplan configuration
  ansible.builtin.copy:
    dest: "{{ _netplan_config_file }}"
    content: "{{ _updated_netplan_doc | to_nice_yaml(indent=2, sort_keys=false) }}"
    owner: root
    group: root
    mode: '0600'
    backup: true
  become: true
  register: _netplan_write

- name: Apply netplan
  ansible.builtin.command:
    cmd: netplan apply
  become: true
  changed_when: true
  when: _netplan_write.changed
