---
- name: Validate /etc/hosts entries
  ansible.builtin.assert:
    that:
      - pcd_storage_host_entries is defined
      - pcd_storage_host_entries | length > 0
    fail_msg: "Set pcd_storage_host_entries as a list of {ip, names} values before running this play."

- name: Validate /etc/hosts entry values
  ansible.builtin.assert:
    that:
      - item.ip is defined
      - item.ip | length > 0
      - item.ip is not match('^<.*>$')
      - item.names is defined
      - item.names | length > 0
      - item.names | reject('match', '^<.*>$') | list | length == item.names | length
    fail_msg: "Each pcd_storage_host_entries item must include ip and names values."
  loop: "{{ pcd_storage_host_entries }}"

- name: Add PCD host entries to /etc/hosts
  become: true
  ansible.builtin.blockinfile:
    path: /etc/hosts
    marker: "# {mark} ANSIBLE MANAGED PCD HOST ENTRIES"
    block: |
      {% for entry in pcd_storage_host_entries %}
      {{ entry.ip }} {{ entry.names | join(' ') }}
      {% endfor %}
    state: present
    backup: true

- name: Validate PCD NFS mount definitions
  ansible.builtin.assert:
    that:
      - pcd_storage_nfs_mounts is sequence
      - pcd_storage_nfs_mounts is not string
      - pcd_storage_nfs_mounts | length > 0
      - item.src is defined
      - item.src | length > 0
      - item.src is match('^[^:\s]+:/\S+$')
      - item.src is not match('^<.*>$')
      - item.path is defined
      - item.path is match('^/')
      - item.path is not match('^<.*>$')
    fail_msg: >-
      Each pcd_storage_nfs_mounts item must define src as
      NFS_SERVER:/EXPORT_PATH and path as an absolute host mount path.
  loop: "{{ pcd_storage_nfs_mounts }}"
  loop_control:
    label: "{{ item.path | default(item.src | default('invalid mount')) }}"

- name: Validate PCD NFS mount paths are unique
  ansible.builtin.assert:
    that:
      - >-
        (pcd_storage_nfs_mounts | map(attribute='path') | unique | length)
        == (pcd_storage_nfs_mounts | length)
    fail_msg: "Each PCD NFS mount must use a unique host mount path."

- name: Create PCD storage mount directories
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop: "{{ pcd_storage_nfs_mounts }}"
  loop_control:
    label: "{{ item.path }}"

- name: Configure and mount PCD NFS storage
  become: true
  ansible.posix.mount:
    src: "{{ item.src }}"
    path: "{{ item.path }}"
    fstype: nfs
    opts: vers=4,proto=tcp
    dump: "0"
    passno: "0"
    state: mounted
    backup: true
  loop: "{{ pcd_storage_nfs_mounts }}"
  loop_control:
    label: "{{ item.src }} -> {{ item.path }}"

- name: Check pf9 user exists before setting ownership
  become: true
  ansible.builtin.getent:
    database: passwd
    key: pf9
  register: pcd_storage_pf9_user
  failed_when: false

- name: Check pf9group group exists before setting ownership
  become: true
  ansible.builtin.getent:
    database: group
    key: pf9group
  register: pcd_storage_pf9_group
  failed_when: false

- name: Report missing pf9 ownership prerequisites
  ansible.builtin.debug:
    msg: "pf9 user or pf9group group is not present; recursive chown will still be attempted and ignored if the OS cannot resolve the account."
  when: pcd_storage_pf9_user.failed or pcd_storage_pf9_group.failed

- name: Ensure PCD storage directory ownership is recursive
  become: true
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    owner: pf9
    group: pf9group
    recurse: true
  loop: "{{ pcd_storage_nfs_mounts }}"
  loop_control:
    label: "{{ item.path }}"
  register: pcd_storage_ownership_result
  failed_when: false
