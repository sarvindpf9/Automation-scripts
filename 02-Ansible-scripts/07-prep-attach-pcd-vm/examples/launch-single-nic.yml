---
# Example extra-vars file for launching one VM with a single tagged NIC.
# Run with:
#   ansible-playbook playbooks/create-vms.yml -e @examples/launch-single-nic.yml

ssh_public_key_path: ~/.ssh/id_rsa.pub
cloud_init_user: ubuntu

vms:
  single_nic_vm:
    vm_name: <SINGLE_NIC_VM_NAME>
    # vm_id is optional. Omit it to auto-assign the next free ID cluster-wide.
    # Set it explicitly (integer, 100–999999) to pin a specific ID.
    # vm_id: 101
    memory_mb: 4096
    cores: 4
    sockets: 1
    disk_size_gb: 50
    network_interfaces:
      - bridge: <PROXMOX_BRIDGE>
        vlan_id: <VLAN_ID>
        ip: <VM_CIDR_IP>
        gw: <GATEWAY_IP>
        dns:
          - <DNS_SERVER>
        vlan_devices: []

  # DHCP variant: omit ip/gw/dns and set dhcp4: true.
  # The assigned IP will not appear in the vm-ip-list output since it is
  # unknown at deploy time.
  single_nic_dhcp_vm:
    vm_name: <DHCP_VM_NAME>
    # vm_id: 102
    memory_mb: 4096
    cores: 4
    sockets: 1
    disk_size_gb: 50
    network_interfaces:
      - bridge: <PROXMOX_BRIDGE>
        vlan_id: <VLAN_ID>
        dhcp4: true
        vlan_devices: []

