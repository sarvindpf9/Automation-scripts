---
# Proxmox API endpoint details. Use Ansible Vault or extra-vars for secrets.
proxmox_api_host: <PROXMOX_API_HOST>
proxmox_api_port: 8006
proxmox_api_user: <PROXMOX_API_USER_WITH_REALM>
proxmox_api_password: <PROXMOX_API_PASSWORD>
proxmox_validate_certs: false
proxmox_api_timeout: 300

# Proxmox placement and default template source. Individual VMs can override
# template_vm_id/template_vm_name when deploying mixed OS templates together.
proxmox_node: <PROXMOX_NODE_NAME>
template_vm_id: <TEMPLATE_VM_ID>
template_vm_name: <TEMPLATE_VM_NAME>
datastore_id: <DATASTORE_ID>
cloudinit_drive_datastore_id: <DATASTORE_ID>
snippet_datastore_id: local

# VM ID auto-allocation range. vm_id is optional in the vms map below —
# omit it to auto-assign the next free ID across the entire cluster.
# IDs are picked from [vm_id_start, vm_id_end] skipping any already in use.
# Must be >= 100 (Proxmox minimum). All effective template VMIDs are excluded.
vm_id_start: 4000
vm_id_end: 8000

# Filesystem path on the Proxmox node for snippet_datastore_id.
# For default local storage this is normally /var/lib/vz/snippets.
snippet_directory: /var/lib/vz/snippets

# SSH public key injected into the cloud-init user.
ssh_public_key_path: ~/.ssh/id_rsa.pub
cloud_init_user: ubuntu
cloud_init_user_password: password

# Optional prefix prepended to each VM name. Leave empty to use vm_name exactly
# as defined in the vms map.
vm_name_prefix: ""

# VM deployment map, equivalent to the Terraform vms map.
# vm_id is optional: omit it to auto-assign the next free ID cluster-wide.
# Set it explicitly only when you need to pin a specific ID.
vms:
  vm1:
    vm_name: <VM1_NAME>
    # vm_id: <VM1_ID>   # optional — auto-allocated from vm_id_start..vm_id_end if omitted
    # template_vm_id: <VM1_TEMPLATE_VM_ID>       # optional — defaults to global template_vm_id
    # template_vm_name: <VM1_TEMPLATE_VM_NAME>   # optional — defaults to global template_vm_name
    # cloud_init_user: <VM1_CLOUD_INIT_USER>     # optional — defaults to global cloud_init_user
    memory_mb: 4096
    cores: 4
    sockets: 1
    disk_size_gb: 50
    # Each NIC supports two addressing modes:
    #   Static: set ip (CIDR), gw, and dns.
    #   DHCP:   set dhcp4: true and omit ip/gw/dns.
    network_interfaces:
      - bridge: <PROXMOX_BRIDGE>
        vlan_id: <VLAN_ID>
        ip: <VM1_CIDR_IP>
        gw: <GATEWAY_IP>
        dns:
          - <DNS_SERVER>
        vlan_devices: []
      - bridge: <PROXMOX_TRUNK_BRIDGE>
        vlan_devices:
          - id: <VLAN_ID>
            ip: <VM1_VLAN_CIDR_IP>
            gw: <GATEWAY_IP>
  vm2:
    vm_name: <VM2_NAME>
    # vm_id: <VM2_ID>   # optional — auto-allocated from vm_id_start..vm_id_end if omitted
    memory_mb: 4096
    cores: 4
    sockets: 1
    disk_size_gb: 50
    network_interfaces:
      - bridge: <PROXMOX_BRIDGE>
        vlan_id: <VLAN_ID>
        ip: <VM2_CIDR_IP>
        gw: <GATEWAY_IP>
        dns:
          - <DNS_SERVER>
        vlan_devices: []

# Nameservers written into the static netplan configuration by dhcp-to-static.yml.
# Accepts a list of one or more IP addresses.
# When omitted (commented out), the task falls back to addresses currently
# reported by ansible_facts['dns']['nameservers'] on each target host.
# nameservers:
#   - <NS1_IP>
#   - <NS2_IP>

# VM behavior options.
start_vms: true
detach_cloudinit_drive: true
clone_full: true
disk_format: raw
cpu_type: host
scsi_controller: virtio-scsi-single
boot_order: order=scsi0
qemu_agent_enabled: false
qemu_agent_fstrim_cloned_disks: true
qemu_agent_freeze_fs_on_backup: true

# Generated guest inventory. Static primary IPs are read from vms; DHCP primary
# IPs require qemu_agent_enabled: true and qemu-guest-agent running in the VM.
generated_guest_inventory_enabled: true
generated_guest_inventory_path: generated/vm-inventory.yml
generated_guest_inventory_user: ubuntu
# Leave empty to derive from ssh_public_key_path by removing the .pub suffix.
generated_guest_inventory_ssh_private_key_path: ""
guest_agent_inventory_initial_delay_seconds: 90
guest_agent_inventory_max_wait_seconds: 900
guest_agent_inventory_poll_interval_seconds: 10

# Delete behavior used by playbooks/delete-vms.yml.
delete_force: true
delete_purge: true
delete_remove_snippets: true

# PCD host attach settings used by playbooks/attach-pcd-hostagent.yml.
# Override pcd_attach_hosts to a concrete inventory group or host pattern.
pcd_attach_hosts: proxmox_vms
pcdctl_setup_url: https://pcdctl.s3.us-west-2.amazonaws.com/pcdctl-setup
pcdctl_setup_path: /tmp/pcdctl-setup
pcd_region_portal: <PCD_REGION_PORTAL_URL>
cloud_username: <PCD_USERNAME>
cloud_password: <PCD_PASSWORD>
cloud_project_name: <PCD_PROJECT_NAME>
cloud_region_name: <PCD_REGION_NAME>

# PCD guest storage preparation used by playbooks/prepare-pcd-storage.yml.
# Set pcd_storage_hosts to the inventory group or host pattern to configure.
pcd_storage_hosts: proxmox_vms
pcd_storage_host_entries: []
# NFS exports mounted on each PCD host. Override the full list when the NFS
# server, export paths, or local mount paths differ from these defaults.
pcd_storage_nfs_mounts:
  - src: 10.96.7.20:/mnt/nfsshare/glance
    path: /var/opt/imagelibrary/data
  - src: 10.96.7.20:/mnt/nfsshare/ephemeral
    path: /opt/data/instances
# Example:
# pcd_storage_host_entries:
#   - ip: <IP_ADDRESS>
#     names:
#       - <FQDN>
#       - <HOST_ALIAS>
