---
proxmox_api_host: xx.xx.xx.xx
proxmox_api_port: 8006
proxmox_api_user: "someusername@pam"
proxmox_api_password: "somepassword"
proxmox_validate_certs: false
proxmox_api_timeout: 300

proxmox_node: sa-03
template_vm_id: 600
template_vm_name: ubuntu-24-04-tmpl
datastore_id: data-sa-03
cloudinit_drive_datastore_id: data-sa-03
snippet_datastore_id: local
snippet_directory: /var/lib/vz/snippets

generated_guest_inventory_enabled: true
ssh_public_key_path: ~/.ssh/id_ed25519.pub
cloud_init_user: someusername
cloud_init_user_password: "somepassword"

nameservers:
  - xx.xx.xx.xx

vm_name_prefix: someusername

# PCD host enrolment vars
pcd_region_portal: "https://pf9-community.ce.janp1"
cloud_username: "someusername@abc.com"
cloud_password: "somepassword"
cloud_project_name: "service"
cloud_region_name: "community"


pcd_storage_host_entries:
  - ip: xx.xx.xx.xx
    names:
      - pf9-salocal.ce.janp1
      - salocal
  - ip: xx.xx.xx.xx
    names:
      - pf9.ce.janp1
      - janp1
vms:
  ubuntu24-lab-test1:
    vm_name: u24-test1
    vm_id: 1010
    memory_mb: 8096
    cores: 4
    sockets: 1
    disk_size_gb: 130
    network_interfaces:
      - bridge: brxx
        dhcp4: true
      - bridge: brxx
        dhcp4: false
# VM behavior options.
start_vms: true
detach_cloudinit_drive: true
clone_full: true
disk_format: raw
cpu_type: host
scsi_controller: virtio-scsi-single
boot_order: order=scsi0
qemu_agent_enabled: true

# Delete behavior used by playbooks/delete-vms.yml.
delete_force: true
delete_purge: true
delete_remove_snippets: true