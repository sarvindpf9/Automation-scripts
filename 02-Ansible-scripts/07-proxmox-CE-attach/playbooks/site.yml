---
# Full CE attach workflow — run all three phases in sequence.
#
# Phase 1: Create CE VMs on Proxmox from a cloud-init template.
# Phase 2: Download cloud-ctl and commission each VM into PCD.
# Phase 3: Apply persistent netplan config and NFS mounts on each CE node.
#
# Usage:
#   ansible-playbook playbooks/site.yml
#
# To run a single phase:
#   ansible-playbook playbooks/01-create-vms.yml
#   ansible-playbook playbooks/02-commission-hosts.yml
#   ansible-playbook playbooks/03-prepare-ce-vms.yml

- name: Phase 1 — Create CE VMs on Proxmox
  ansible.builtin.import_playbook: 01-create-vms.yml

- name: Phase 2 — Commission CE hosts into PCD
  ansible.builtin.import_playbook: 02-commission-hosts.yml

- name: Phase 3 — Prepare CE nodes (netplan, NFS, hostname)
  ansible.builtin.import_playbook: 03-prepare-ce-vms.yml
