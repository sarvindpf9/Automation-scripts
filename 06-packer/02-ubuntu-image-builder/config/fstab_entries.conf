# fstab_entries.conf — entries appended to /etc/fstab during image build.
#
# Format (standard /etc/fstab columns):
#   <device>  <mountpoint>  <fstype>  <options>  <dump>  <pass>
#
# IMPORTANT: these entries are written into the image but mount -a is NOT called
# during the build. Entries take effect on the deployed instance at boot or when
# mounted explicitly. Use 'noauto' if you want to control mounting manually.
#
# Examples:
#
#   NFS share (mount manually: mount /mnt/shared):
#   192.168.1.100:/exports/shared  /mnt/shared  nfs  defaults,noauto,_netdev  0  0
#
#   Additional data disk by UUID (not auto-mounted at boot):
#   UUID=<DISK_UUID>  /data  ext4  defaults,noauto  0  2
#
#   tmpfs ramdisk:
#   tmpfs  /run/shm  tmpfs  defaults,noauto,noexec,nosuid  0  0
#
# Add your entries below this line. Lines starting with # are ignored.
