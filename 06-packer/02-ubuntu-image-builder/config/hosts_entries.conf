# hosts_entries.conf — entries appended to /etc/hosts during image build.
#
# Format (standard /etc/hosts columns):
#   <ip_address>  <canonical_hostname>  [<alias> ...]
#
# Examples:
#
#   10.0.0.10  controller.example.com  controller
#   10.0.0.11  compute1.example.com    compute1
#   10.0.0.12  compute2.example.com    compute2
#
# Add your entries below this line. Lines starting with # are ignored.
