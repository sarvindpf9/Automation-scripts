groups:
  - name: memory_alerts
    rules:

    - alert: PCDTargetDown
      expr: up{job="ne"} == 0
      for: 2m
      labels:
        severity: critical
        component: host
        cluster_name: "{{ $labels.cluster_name }}"   # pull into label for grouping
      annotations:
        summary: "Exporter unreachable: {{ $labels.host_name }} ({{ $labels.cluster_name }})"
        description: "{{ $labels.instance }} has been unreachable for 2 minutes."

    - alert: PCDHypervisorHighCPU
      expr: (sum by (instance) (pcd:hyp_cpu_usage) / sum by (instance) (pcd:hyp_cpu_total)) * 100  > 80
      for: 10m
      labels:
        severity: warning
        component: host
      annotations:
        summary: "High CPU usage on host {{ $labels.instance }}"
        description: "CPU usage has been above 80% for 10 minutes (current value: {{ $value | printf \"%.1f\" }}%)."
  
    - alert: PCDHypervisorCriticalCPU
      expr: (sum by (instance) (pcd:hyp_cpu_usage) / sum by (instance) (pcd:hyp_cpu_total)) * 100 > 95
      for: 5m
      labels:
        severity: critical
        component: host
      annotations:
        summary: "Critical CPU usage on host {{ $labels.instance }}"
        description: "CPU usage has been above 95% for 5 minutes (current value: {{ $value | printf \"%.1f\" }}%)."
  
    - alert: PCDHypervisorHighMemory
      expr: (sum by (instance) (pcd:hyp_mem_usage) / sum by (instance) (pcd:hyp_mem_total)) * 100  > 80
      for: 10m
      labels:
        severity: warning
        component: host
      annotations:
        summary: "High Memory usage on host {{ $labels.instance }}"
        description: "Memory usage has been above 80% for 10 minutes (current value: {{ $value | printf \"%.1f\" }}%)."
  
    - alert: PCDHypervisorCriticalMemory
      expr: (sum by (instance) (pcd:hyp_mem_usage) / sum by (instance) (pcd:hyp_mem_total)) * 100 > 95
      for: 5m
      labels:
        severity: critical
        component: host
      annotations:
        summary: "Critical Memory usage on host {{ $labels.instance }}"
        description: "Memory usage has been above 95% for 5 minutes (current value: {{ $value | printf \"%.1f\" }}%)."


      # -----------------------------------------------------------------
      # HOST - Disk usage / capacity forecast
      # -----------------------------------------------------------------
    - alert: PCDHypervisorDiskUsageHigh
      expr: pcd:hyp_disk_usage{fstype!~"tmpfs|overlay|squashfs"} > 85
      for: 15m
      labels:
        severity: warning
        component: host
      annotations:
        summary: "High disk usage on {{ $labels.instance }} ({{ $labels.fstype }})"
        description: "Filesystem usage has been above 85% for 15 minutes (current value: {{ $value | printf \"%.1f\" }}%)."

    - alert: PCDHypervisorDiskUsageCritical
      expr: pcd:hyp_disk_usage{fstype!~"tmpfs|overlay|squashfs"} > 95
      for: 5m
      labels:
        severity: critical
        component: host
      annotations:
        summary: "Critical disk usage on {{ $labels.instance }} ({{ $labels.fstype }})"
        description: "Filesystem usage has been above 95% for 5 minutes (current value: {{ $value | printf \"%.1f\" }}%)."

    - alert: PCDHypervisorDiskWillFillIn3Days
      expr: predict_linear(pcd:hyp_disk_free_bytes:avg5m{fstype!~"tmpfs|overlay|squashfs"}[6h], 3 * 24 * 3600) < 0
      for: 30m
      labels:
        severity: warning
        component: host
      annotations:
        summary: "Disk on {{ $labels.instance }} ({{ $labels.fstype }}) predicted to fill within 3 days"
        description: "Based on the last 6h trend, free space on this filesystem will reach 0 within 3 days."

    - alert: PCDHypervisorDiskWillFillIn12Hours
      expr: predict_linear(pcd:hyp_disk_free_bytes:avg5m{fstype!~"tmpfs|overlay|squashfs"}[6h], 12 * 3600) < 0
      for: 10m
      labels:
        severity: critical
        component: host
      annotations:
        summary: "Disk on {{ $labels.instance }} ({{ $labels.fstype }}) predicted to fill within 12 hours"
        description: "Based on the last 6h trend, free space on this filesystem will reach 0 within 12 hours."

    # -----------------------------------------------------------------
    # HOST - Network
    # -----------------------------------------------------------------
    - alert: PCDHypervisorNetworkErrors
      expr: rate(node_network_receive_errs_total[5m]) > 0 or rate(node_network_transmit_errs_total[5m]) > 0
      for: 10m
      labels:
        severity: warning
        component: host
      annotations:
        summary: "Network errors on {{ $labels.instance }} ({{ $labels.device }})"
        description: "Interface has been reporting rx/tx errors for 10 minutes (rate: {{ $value | printf \"%.4f\" }}/s)."

    - alert: PCDHypervisorNetworkDrops
      expr: pcd:hyp_net_rx_drop_rate:5m > 0 or pcd:hyp_net_tx_drop_rate:5m > 0
      for: 10m
      labels:
        severity: warning
        component: host
      annotations:
        summary: "Network packet drops on {{ $labels.instance }}"
        description: "Interface has been dropping packets for 10 minutes (rate: {{ $value | printf \"%.4f\" }}/s)."

    # NOTE: tune this threshold (MB/s) to the actual NIC capacity of the
    # fleet, e.g. ~80% of a 10GbE link is roughly 950 MB/s.
    - alert: PCDHypervisorNetworkHighThroughput
      expr: pcd:hyp_net_host_total_MBps > 950
      for: 10m
      labels:
        severity: warning
        component: host
      annotations:
        summary: "Sustained high network throughput on {{ $labels.instance }}"
        description: "Combined rx+tx throughput has been above the configured threshold for 10 minutes (current value: {{ $value | printf \"%.1f\" }} MB/s)."

    # -----------------------------------------------------------------
    # HOST - systemd services (pf9-* units only, see pf9-node-exporter.service)
    # -----------------------------------------------------------------
    - alert: PCDSystemdServiceNotActive
      expr: node_systemd_unit_state{state='active'} == 0
      for: 5m
      labels:
        severity: warning
        component: host
      annotations:
        summary: "{{ $labels.name }} not active on {{ $labels.instance }}"
        description: "Service {{ $labels.name }} has not been in the active state for at least 5 minutes."

    - alert: PCDSystemdServiceDownLong
      expr: node_systemd_unit_state{state='active'} == 0
      for: 30m
      labels:
        severity: critical
        component: host
      annotations:
        summary: "{{ $labels.name }} down on {{ $labels.instance }} for over 30m"
        description: "Service {{ $labels.name }} has not been in the active state for at least 30 minutes."

    - alert: PCDSystemdServiceRestartingFrequently
      expr: changes(node_systemd_unit_state{state='active'}[15m]) > 2
      for: 0m
      labels:
        severity: warning
        component: host
      annotations:
        summary: "{{ $labels.name }} restarting frequently on {{ $labels.instance }}"
        description: "Service {{ $labels.name }} active-state has toggled {{ $value }} times in the last 15 minutes, suggesting a crash/restart loop."

    # -----------------------------------------------------------------
    # VM (libvirt-exporter) - CPU
    # -----------------------------------------------------------------
    - alert: PCDVmHighCPU
      expr: (pcd:vm_cpu_usage / pcd:vm_cpu_total) * 100 > 80
      for: 10m
      labels:
        severity: warning
        component: vm
      annotations:
        summary: "High CPU usage on VM {{ $labels.domain }}"
        description: "VM vCPU usage has been above 80% for 10 minutes (current value: {{ $value | printf \"%.1f\" }}%)."


    # -----------------------------------------------------------------
    # VM - Memory
    # -----------------------------------------------------------------
    # pcd:vm_mem_allocated is actually available memory (see its expr above),
    # so this is available-vs-max, i.e. the inverse gives usage relative to
    # the VM's configured max memory (pcd:vm_mem_total).
    - alert: PCDVmHighMemory
      expr: (1 - (pcd:vm_mem_allocated / pcd:vm_mem_total)) * 100 > 80
      for: 10m
      labels:
        severity: warning
        component: vm
      annotations:
        summary: "High memory usage on VM {{ $labels.domain }}"
        description: "VM memory usage has been above 80% for 10 minutes (current value: {{ $value | printf \"%.1f\" }}%)."